[build-system]
# Pure-Python build: VMEX ships no compiled extensions, so installing it never
# requires a C/C++ toolchain.  All numerics are JAX.
requires = ["setuptools", "wheel", "packaging"]
build-backend = "setuptools.build_meta"

[project]
name = "vmex"
version = "0.5.0"
description = "JAX implementation of VMEC2000 with differentiable fixed-boundary and branch-local free-boundary research paths."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "vmex contributors"}]
license = "MIT"
keywords = ["vmec", "stellarator", "mhd", "jax", "optimization"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
  "numpy",
  "jax",
  "jaxlib",
  "scipy",
  "netCDF4",
  "matplotlib",
  "packaging",
  # JAX's persistent compilation cache uses file locks across processes.
  "filelock",
  "booz_xform_jax",
  # 0.8.8 adds the checked tridiagonal fallback used by VMEX's preconditioner.
  "solvax>=0.8.8",
  "tomli; python_version < '3.11'",
]

[project.scripts]
vmex = "vmex.core.cli:main"
vmec = "vmex.core.cli:main"  # alias

[project.urls]
Homepage = "https://github.com/uwplasma/vmex"
Documentation = "https://vmex.readthedocs.io/en/latest/"
Repository = "https://github.com/uwplasma/vmex"
Issues = "https://github.com/uwplasma/vmex/issues"
Changelog = "https://github.com/uwplasma/vmex/releases"

[project.optional-dependencies]
optimizers = [
  "jaxopt",
  "optax",
]
# Differentiable virtual-casing residual on a specified boundary
# (plan.md R15.3 + R19); this is not a NESTOR equilibrium adjoint.
# virtual-casing-jax >= 0.0.4 from the canonical
# https://github.com/uwplasma/virtual_casing_jax carries the batch-stable
# exterior-field API vmex drives. Surface-data construction
# remains available without the extra; solver tests use an explicit skip.
freeb = [
    "virtual-casing-jax>=0.0.4",
]
#
# Gyrokinetic turbulence-proxy objectives (``vmex.core.turbulence``) via GKX,
# uwplasma's JAX-native Hermite-Laguerre flux-tube gyrokinetic solver
# (https://github.com/uwplasma/GKX; PyPI name ``gkx`` — the package formerly
# published as ``spectraxgk``; vmex requires the post-rename >= 1.7.1 API).
turbulence = [
  "gkx>=1.7.1",
]
# ESSOS 0.17 adds named/functional coil DOFs, clearance objectives, and the
# boundary-to-surface adapter used by the single-stage examples.
coils = [
  "essos>=0.17",
]
docs = [
  "sphinx",
  "sphinx-copybutton",
  "furo",
  "myst-parser",
  "sphinx-design",
  "sphinxext-rediraffe",
]
dev = [
  "build",
  "furo",
  "mypy",
  "myst-parser",
  "pytest",
  "pytest-cov",
  "pytest-xdist",
  "ruff",
  "sphinx",
  "sphinx-copybutton",
  "sphinx-design",
  "sphinxext-rediraffe",
  "types-setuptools",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["vmex*", "vmec_jax"]
exclude = ["tests*", "docs*", "examples*", "tools*", "validation*", "results*", "build*", "dist*"]

[tool.setuptools.package-data]
vmex = ["resources/input.nfp4_QH_warm_start"]

[tool.pytest.ini_options]
markers = [
  "full: slower/full-physics tests; set RUN_FULL=1 to run",
  "weekly: high-resolution campaigns excluded from nightly CI",
  "gpu: tests that require a real GPU; skipped when no GPU is available",
  "vmec2000_live: opt-in integration tests requiring a local VMEC2000 executable",
]

[tool.coverage.run]
# freeboundary_diff.py requires the optional virtual-casing-jax >= 0.0.4
# extra (see [project.optional-dependencies]). Its FD-validated gradient
# tests are importorskip-gated and skip in the dependency-minimal core CI,
# so the module is excluded from the core >=95% coverage gate. It is
# exercised by the optional-integrations CI lane. turbulence.py is
# likewise gated on the optional ``turbulence`` extra (gkx).
omit = ["*/freeboundary_diff.py", "*/turbulence.py"]

[tool.coverage.report]
omit = ["*/freeboundary_diff.py", "*/turbulence.py"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Ruff 0.16 changed its implicit default from the classic Pyflakes/pycodestyle
# baseline to every stable rule.  Keep VMEX's existing lint contract explicit
# so an unpinned developer-tool upgrade cannot reclassify the whole repository.
select = ["E4", "E7", "E9", "F"]
# E402: module-level import not at top-of-file.  Deferred imports (after env
#        setup / jax.config calls) are deliberate to control JAX initialisation.
# E501: line too long.  Handled by the line-length setting above; long lines in
#        ported Fortran-style code are acceptable.
# E702: semicolons as statement separators in tightly coupled numerical
#        kernels, common in ported Fortran code.
ignore = ["E402", "E501", "E702"]

[tool.mypy]
# Note: recent numpy stubs use PEP 695 `type` statements, so the checked
# python_version cannot be pinned below 3.12.
ignore_missing_imports = true
# With full defaults the core trips 38 errors in 11 files, all jax.Array /
# ndarray-typing false positives (mypy sees opaque jax.Array where numpy
# overloads are annotated).  Disabled codes shrunk from the legacy 14-code
# blanket to the 8 the core actually needs; name-defined, valid-type,
# call-arg, misc, type-arg, no-any-return and override are enabled again.
disable_error_code = ["operator", "union-attr", "assignment", "arg-type", "index", "return-value", "list-item", "attr-defined"]
