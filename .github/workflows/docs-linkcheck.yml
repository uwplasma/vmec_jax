name: Docs linkcheck

# External-link audit of the docs tree (plan_docs_vmex.md section 9.4):
# weekly, on demand, and on pull requests that touch docs/. Hosts that
# reject CI runners are pinned in `linkcheck_ignore` in docs/conf.py, each
# with its reason.

on:
  workflow_dispatch:
  schedule:
    - cron: "43 2 * * 6"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs-linkcheck.yml"

concurrency:
  group: docs-linkcheck-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linkcheck:
    name: sphinx -b linkcheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install ".[docs]"
      - name: Check external links
        run: |
          python -m sphinx -b linkcheck docs docs/_build/linkcheck
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: linkcheck-output
          path: docs/_build/linkcheck/output.txt
